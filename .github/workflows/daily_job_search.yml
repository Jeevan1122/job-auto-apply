name: Daily Job Search

on:
  schedule:
    # 6:00 AM CDT = 11:00 UTC (summer). Change to 12:00 UTC in winter (CST = UTC-6).
    - cron: '0 11 * * *'
  workflow_dispatch:   # trigger manually from the GitHub Actions tab anytime

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "openai>=1.30.0" \
            "httpx>=0.27.0" \
            "python-dotenv>=1.0.0" \
            "pdfminer.six>=20221105" \
            "python-docx>=1.1.0" \
            "tenacity>=8.3.0" \
            "supabase>=2.4.0"

      # ── 4. Run search + score for every registered user ───────────────────
      - name: Run daily job search for all users
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_JOBS_PER_RUN:     "60"
          MIN_RELEVANCE_SCORE:  "0.65"
        run: python ci/run_for_all_users.py
